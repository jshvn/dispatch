# Everything here is a devDependency, so one grouped PR per ecosystem per week is the whole
# surface. `check` gates them: wrangler types, tsc, biome, vitest, and a deploy dry-run.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
